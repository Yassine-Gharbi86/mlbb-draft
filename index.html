<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>MLBB Draft Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<style>
  html { background: #070b14; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-family: 'Rajdhani', system-ui, sans-serif; font-weight: 600; }
  /* pro-scene backdrop: blue left, red right, gold top glow + faint grid */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(245,196,81,.13), transparent 65%),
      radial-gradient(700px 600px at -5% 45%, rgba(59,130,246,.17), transparent 65%),
      radial-gradient(700px 600px at 105% 45%, rgba(239,68,68,.17), transparent 65%),
      linear-gradient(rgba(148,163,184,.045) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(148,163,184,.045) 1px, transparent 1px) 0 0 / 44px 44px; }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  img { -webkit-user-drag: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: pan-y; }
  .f-display { font-family: 'Orbitron', system-ui, sans-serif; }
  .title-gradient { background: linear-gradient(90deg, #fde68a, #f5c451 40%, #ffffff 58%, #f5c451); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* team panels (no vars / clip-path so the screenshot export renders them right) */
  .team-card { border-radius: 18px; overflow: hidden; background: linear-gradient(180deg, rgba(15,23,42,.94), rgba(6,10,20,.96)); border: 1px solid rgba(148,163,184,.18); }
  .team-blue { box-shadow: 0 0 0 1px rgba(59,130,246,.3), 0 14px 44px -14px rgba(59,130,246,.55); }
  .team-red  { box-shadow: 0 0 0 1px rgba(239,68,68,.3), 0 14px 44px -14px rgba(239,68,68,.55); }
  .team-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; color: #fff; }
  .team-blue .team-head { background: linear-gradient(90deg, #2563eb, rgba(37,99,235,.05)); }
  .team-red  .team-head { background: linear-gradient(90deg, #dc2626, rgba(220,38,38,.05)); }
  .slot { padding: 12px; border-radius: 12px; border-left: 3px solid; background: linear-gradient(90deg, rgba(30,41,59,.75), rgba(15,23,42,.55)); }
  .team-blue .slot { border-left-color: #3b82f6; }
  .team-red  .slot { border-left-color: #ef4444; }
  .lane-tag { font-family: 'Orbitron', system-ui, sans-serif; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #f5c451; }
  .pname { font-size: 20px; line-height: 1.05; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .hero-name { font-size: 15px; font-weight: 700; color: #f5c451; letter-spacing: .04em; }
  .chip { display: inline-block; margin-top: 3px; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: rgba(16,185,129,.16); border: 1px solid rgba(52,211,153,.45); color: #6ee7b7; }
  .chip-live { background: rgba(245,158,11,.12); border-color: rgba(251,191,36,.3); color: rgba(253,230,138,.7); }
  .vs { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 900; font-size: 18px; color: #f5c451; border: 2px solid #f5c451; border-radius: 10px; padding: 6px 12px; letter-spacing: .12em; box-shadow: 0 0 24px rgba(245,196,81,.35); background: rgba(2,6,23,.7); }

  /* buttons */
  .btn-gold { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #1a1204; border-radius: 12px;
    background: linear-gradient(180deg, #fde68a, #f5c451 55%, #d99a1a); box-shadow: 0 0 26px rgba(245,196,81,.35), inset 0 1px 0 rgba(255,255,255,.6); transition: transform .1s, filter .15s; }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-gold:active { transform: scale(.96); }
  .btn-gold:disabled { opacity: .6; cursor: not-allowed; }
  .btn-ghost { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #e2e8f0; border-radius: 12px; background: rgba(30,41,59,.9); border: 1px solid rgba(148,163,184,.4); transition: transform .1s, background .15s; }
  .btn-ghost:hover { background: rgba(51,65,85,.95); }
  .btn-ghost:active { transform: scale(.96); }
  .btn-ghost:disabled { opacity: .6; }

  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .45s ease-out both; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .shake { animation: shake .12s infinite; }
</style>
</head>
<body class="text-slate-100">
<main class="max-w-6xl mx-auto px-3 sm:px-4 pt-[calc(1.25rem+env(safe-area-inset-top))] pb-36 sm:pt-8 sm:pb-12">

  <header id="arena" class="relative h-[190px] sm:h-[250px] scroll-mt-3">
    <div id="catWrap" class="absolute inset-0"></div>
    <div class="relative z-10 h-full flex flex-col items-center justify-center text-center px-14 sm:px-0 pointer-events-none">
      <p class="f-display text-[8px] sm:text-xs tracking-[.3em] sm:tracking-[.35em] text-amber-300/80 uppercase">Mobile Legends · 5v5 Draft</p>
      <h1 class="f-display title-gradient text-2xl sm:text-5xl font-black tracking-wider mt-2">DRAFT ARENA</h1>
      <p class="text-slate-400 text-xs sm:text-lg mt-1">Random lanes, heroes &amp; builds 😈</p>
    </div>
    <div id="loading" class="f-display absolute bottom-0 inset-x-0 text-center text-amber-200/70 text-[9px] sm:text-[10px] tracking-[.3em] uppercase pointer-events-none">Loading Lunox… 0%</div>
  </header>

  <p id="status" class="f-display text-center text-amber-300 text-[11px] sm:text-sm tracking-[.2em] uppercase mt-3 min-h-[2.5rem]"></p>

  <div id="stage" class="hidden grid lg:grid-cols-[1fr_auto_1fr] gap-3 sm:gap-6 items-start scroll-mt-3">
    <div id="blue" class="scroll-mt-3"></div>
    <div class="flex lg:flex-col items-center justify-center gap-3 lg:pt-28"><span class="vs">VS</span></div>
    <div id="red" class="scroll-mt-3"></div>
  </div>

  <div class="fixed bottom-0 inset-x-0 z-20 flex justify-center gap-3 px-4 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] bg-slate-950/90 backdrop-blur border-t border-amber-300/20 sm:static sm:z-auto sm:bg-transparent sm:backdrop-blur-none sm:border-0 sm:p-0 sm:mt-8">
    <button id="btn" class="btn-gold flex-1 sm:flex-none px-4 sm:px-10 py-4 sm:py-3 text-xs sm:text-base">🎲 Randomize Teams</button>
    <button id="shotBtn" class="btn-ghost hidden flex-1 sm:flex-none px-4 sm:px-8 py-4 sm:py-3 text-xs sm:text-base">📸 Screenshot</button>
  </div>
</main>

<div id="shotModal" class="hidden fixed inset-0 z-50 bg-black/85 flex-col items-center px-4 pt-[calc(1rem+env(safe-area-inset-top))] pb-[calc(1rem+env(safe-area-inset-bottom))]">
  <p class="text-slate-300 text-xs sm:text-sm mb-3 text-center">Long-press the image to save it, or tap the button 👇</p>
  <div class="flex-1 min-h-0 w-full overflow-auto flex justify-center items-start">
    <img id="shotImg" alt="MLBB draft screenshot" class="max-w-full h-auto rounded-lg" style="-webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;">
  </div>
  <div class="flex gap-3 mt-3 w-full max-w-md">
    <button id="shotShare" class="btn-gold flex-1 px-4 py-4 text-xs">💾 Save / Share</button>
    <button id="shotClose" class="btn-ghost px-6 py-4 text-xs">Close</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  /* ---------- config ---------- */
  const DURATION = 7000; // ms
  const LANES = ["Gold Lane", "Mid Lane", "Jungle", "EXP Lane", "Roam"];
  const ICONS = { "Gold Lane": "🪙", "Mid Lane": "🔮", "Jungle": "🌲", "EXP Lane": "⚔️", "Roam": "🛡️" };
  const MESSAGES = [
    "Consulting the ancient spirits... 🔮",
    "Asking Lunox... 🦋",
    "Bribing the RNG gods... 💸",
    "Calculating who feeds... 💀",
    "Checking who's gonna AFK... 😴",
    "Almost there... 👀",
  ];

  /* ---------- team logic ---------- */
  const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const PLAYERS = ["Dilla", "Soup", "Edouard", "Misha", "Lex", "Lifehack", "Maison", "Person1", "Blaze", "Kranok"];

  const HEROES = `Aamon|Akai|Aldous|Alice|Alpha|Alucard|Angela|Argus|Arlott|Atlas|Aulus|Aurora|Badang|Balmond|Bane|Barats|Baxia|Beatrix|Belerick|Benedetta|Brody|Bruno|Carmilla|Cecilion|Chang'e|Chip|Chou|Cici|Claude|Clint|Cyclops|Diggie|Dyrroth|Edith|Esmeralda|Estes|Eudora|Fanny|Faramis|Floryn|Franco|Fredrinn|Freya|Gatotkaca|Gloo|Gord|Granger|Grock|Guinevere|Gusion|Hanabi|Hanzo|Harith|Harley|Hayabusa|Helcurt|Hilda|Hirara|Hylos|Irithel|Ixia|Jawhead|Johnson|Joy|Julian|Kadita|Kagura|Kaja|Kalea|Karina|Karrie|Khaleed|Khufra|Kimmy|Lancelot|Lapu-Lapu|Layla|Leomord|Lesley|Ling|Lolita|Lukas|Lunox|Luo Yi|Lylia|Marcel|Martis|Masha|Mathilda|Melissa|Minotaur|Minsitthar|Miya|Moskov|Nana|Natalia|Natan|Nolan|Novaria|Obsidia|Odette|Paquito|Pharsa|Phoveus|Popol and Kupa|Rafaela|Roger|Ruby|Saber|Selena|Silvanna|Sora|Sun|Suyou|Terizla|Thamuz|Tigreal|Uranus|Vale|Valentina|Valir|Vexana|Wanwan|X.Borg|Xavier|Yi Sun-shin|Yin|Yu Zhong|Yve|Zetian|Zhask|Zhuxin|Zilong`.split("|");

  const SPELLS = ["Execute", "Retribution", "Inspire", "Sprint", "Revitalize", "Aegis", "Petrify", "Purify", "Flameshot", "Flicker", "Arrival", "Vengeance"];
  const OTHER_SPELLS = SPELLS.filter(s => s !== "Retribution");
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- items ---------- */
  const BOOT_SLUGS = ["arcane-boots","demon-boots","magic-boots","rapid-boots","swift-boots","tough-boots","warrior-boots"];
  const ITEM_SLUGS = ["antique-cuirass","athenas-shield","berserkers-fury","blade-armor","blade-of-despair","blade-of-the-heptaseas","blood-wings","brute-force-breastplate","chastise-pauldron","clock-of-destiny","concentrated-energy","corrosion-scythe","cursed-helmet","demon-hunter-sword","divine-glaive","dominance-ice","enchanted-talisman","endless-battle","feather-of-heaven","flask-of-the-oasis","fleeting-time","genius-wand","glowing-wand","golden-staff","great-dragon-spear","guardian-helmet","haass-claws","holy-crystal","hunter-strike","ice-queen-wand","immortality","lightning-truncheon","malefic-gun","malefic-roar","oracle","queens-wings","radiant-armor","rose-gold-meteor","sea-halberd","sky-piercer","starlium-scythe","thunder-belt","war-axe","wind-of-nature","windtalker","winter-crown","wishing-lantern"];
  const NAME_FIX = { "athenas-shield": "Athena's Shield", "berserkers-fury": "Berserker's Fury", "haass-claws": "Haas's Claws", "queens-wings": "Queen's Wings" };
  const SMALL = ["of", "the"];
  // active items: a player can only have ONE of these (Conceal blessing counts too)
  const ACTIVE_SLUGS = ["winter-crown", "wind-of-nature"];
  const toItem = (slug, boots) => ({
    slug, boots,
    active: ACTIVE_SLUGS.includes(slug),
    img: `items/${slug}.png`,
    name: NAME_FIX[slug] || slug.split("-").map((w, i) => (i > 0 && SMALL.includes(w)) ? w : w[0].toUpperCase() + w.slice(1)).join(" "),
  });
  const BOOTS = BOOT_SLUGS.map(s => toItem(s, true));
  const ITEMS = ITEM_SLUGS.map(s => toItem(s, false));

  // preload icons so the fast shuffle doesn't flicker blank
  [...BOOTS, ...ITEMS].forEach(it => { const im = new Image(); im.src = it.img; });

  /* ---------- blessings ---------- */
  const JUNGLE_BLESSINGS = [
    { name: "Bloody Retribution", img: "jungle-blessings/bloody-retribution.png" },
    { name: "Flame Retribution", img: "jungle-blessings/flame-retribution.png" },
    { name: "Ice Retribution", img: "jungle-blessings/ice-retribution.png" },
  ];
  const ROAM_BLESSINGS = [
    { name: "Conceal", img: "roam-blessings/conceal.png" },
    { name: "Dire Hit", img: "roam-blessings/dire-hit.png" },
    { name: "Encourage", img: "roam-blessings/encourage.png" },
    { name: "Favor", img: "roam-blessings/favor.png" },
  ];
  [...JUNGLE_BLESSINGS, ...ROAM_BLESSINGS].forEach(b => { const im = new Image(); im.src = b.img; });

  // only jungle and roam get a blessing (one each), everyone else none
  function blessingFor(lane) {
    if (lane === "Jungle") return pick(JUNGLE_BLESSINGS);
    if (lane === "Roam") return pick(ROAM_BLESSINGS);
    return null;
  }

  function buildItems(lane, blessing) {
    // Conceal already counts as the player's one active, so no Winter Crown / Wind of Nature
    let activeUsed = !!blessing && blessing.name === "Conceal";
    const needBoots = lane === "Jungle" || lane === "Roam"; // guaranteed 1 boots
    const out = [];
    let hasBoots = false;
    if (needBoots) { out.push(pick(BOOTS)); hasBoots = true; }

    for (const it of shuffle([...ITEMS, ...BOOTS])) {
      if (out.length === 6) break;
      if (it.boots && hasBoots) continue;   // max one boots
      if (it.active && activeUsed) continue; // max one active
      if (it.boots) hasBoots = true;
      if (it.active) activeUsed = true;
      out.push(it);
    }
    return needBoots ? shuffle(out) : out;
  }

  /* ---------- emblems + talents ---------- */
  const EMBLEM_SLUGS = ["assassin","common","fighter","mage","marksman","support","tank"];
  const TALENT_SLUGS = {
    1: ["agility","fatal","firmness","inspire-talent","rupture","swift","thrill","vitality"],
    2: ["bargain-hunter","festival-of-blood","master-assassin","pull-yourself-together","seasoned-hunter","tenacity","weapon-master","wilderness-blessing"],
    3: ["brave-smite","concussive-blast","focusing-mark","impure-rage","killing-spree","lethal-ignition","quantum-charge","temporal-reign","war-cry","weakness-finder"],
  };
  const TALENT_FIX = { "inspire-talent": "Inspire" };
  const nice = (slug) => TALENT_FIX[slug] || slug.split("-").map((w, i) => (i > 0 && SMALL.includes(w)) ? w : w[0].toUpperCase() + w.slice(1)).join(" ");
  const EMBLEMS = EMBLEM_SLUGS.map(sl => ({ name: nice(sl) + " Emblem", img: `emblems/${sl}.png` }));
  const TALENTS = Object.fromEntries(Object.entries(TALENT_SLUGS).map(([tier, list]) =>
    [tier, list.map(sl => ({ name: nice(sl), img: `talents/tier-${tier}/${sl}.webp` }))]));
  [...EMBLEMS, ...TALENTS[1], ...TALENTS[2], ...TALENTS[3]].forEach(x => { const im = new Image(); im.src = x.img; });

  // one random emblem + one random talent from each of the 3 tiers
  const buildSetup = () => ({ emblem: pick(EMBLEMS), talents: [pick(TALENTS[1]), pick(TALENTS[2]), pick(TALENTS[3])] });

  function generate() {
    // everyone is shuffled: first 5 = Blue, last 5 = Red
    const p = shuffle(PLAYERS);
    // 10 different random heroes, no duplicates across both teams
    const h = shuffle(HEROES).slice(0, 10);
    const A = {}, B = {};
    // each team gets its own random lane order, so anyone can get any lane
    const lanesA = shuffle(LANES), lanesB = shuffle(LANES);
    // jungle always gets Retribution, everyone else a random spell (never Retribution)
    const spellFor = (lane) => lane === "Jungle" ? "Retribution" : pick(OTHER_SPELLS);
    const makePlayer = (name, hero, lane) => {
      const blessing = blessingFor(lane);
      return { name, hero, spell: spellFor(lane), items: buildItems(lane, blessing), blessing, ...buildSetup() };
    };
    LANES.forEach((_, i) => {
      A[lanesA[i]] = makePlayer(p[i], h[i], lanesA[i]);
      B[lanesB[i]] = makePlayer(p[i + 5], h[i + 5], lanesB[i]);
    });
    return [A, B];
  }

  // wide = true is used for the exported screenshot: fixed desktop layout, no animations
  // side = "blue" | "red"
  function card(title, team, side, final, wide = false) {
    const live = wide ? "" : (final ? "pop" : "shake");
    const popOnly = wide ? "" : (final ? "pop" : "");
    const gridCls = wide ? "grid grid-cols-6 gap-2 mt-3" : "grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-1 mt-3";
    const icon = wide ? "w-12 h-12" : "w-11 h-11 sm:w-9 sm:h-9";
    const nameSz = wide ? "text-[13px]" : "text-[11px] sm:text-[12px]";
    // rings don't survive html2canvas, so the export uses borders instead
    const ring = (c) => wide ? `border-2 border-${c}` : `ring-2 ring-${c}`;
    const tile = (x, extra) => `
      <div class="flex flex-col items-center text-center ${popOnly}" title="${x.name}">
        <img src="${x.img}" alt="${x.name}" class="${icon} rounded-md bg-slate-800 ${extra}">
        <span class="${nameSz} font-semibold leading-tight mt-1 ${final ? 'text-slate-300' : 'text-amber-200/60'}">${x.name}</span>
      </div>`;
    const rows = LANES.map(lane => {
      const p = team[lane];
      return `
      <li class="slot">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="lane-tag">${ICONS[lane]} ${lane}</div>
            ${p.blessing ? `
              <div class="flex items-center gap-2 mt-2 ${popOnly}" title="${p.blessing.name}">
                <img src="${p.blessing.img}" alt="${p.blessing.name}" class="${icon} rounded-md bg-slate-800 ${ring('fuchsia-400')}">
                <span class="${nameSz} leading-tight ${final ? 'text-fuchsia-300' : 'text-amber-200/60'}">${p.blessing.name}</span>
              </div>` : ''}
          </div>
          <div class="text-right ${live}">
            <div class="pname ${final ? 'text-white' : 'text-amber-300'}">${p.name}</div>
            <div class="hero-name">${p.hero}</div>
            <div class="chip ${final ? '' : 'chip-live'}">✨ ${p.spell}</div>
          </div>
        </div>
        <div class="${gridCls}">
          ${p.items.map(it => tile(it, it.boots ? ring('amber-400') : '')).join("")}
        </div>
        <div class="grid grid-cols-4 gap-2 mt-3 pt-3 border-t border-slate-700">
          ${[{ ...p.emblem, emblem: true }, ...p.talents].map(x => tile(x, x.emblem ? ring('sky-400') : '')).join("")}
        </div>
      </li>`;
    }).join("");
    return `
      <section class="team-card team-${side}">
        <div class="team-head">
          <h2 class="f-display text-sm sm:text-base font-black tracking-[.2em] uppercase">${title}</h2>
          <span class="text-[11px] tracking-widest uppercase opacity-80">5 players</span>
        </div>
        <ul class="p-2 sm:p-3 space-y-2">${rows}</ul>
      </section>`;
  }

  const $ = (id) => document.getElementById(id);
  let current = null; // the teams currently on screen

  function render(final) {
    const [A, B] = generate();
    current = [A, B];
    $("blue").innerHTML = card("Team Blue", A, "blue", final);
    $("red").innerHTML = card("Team Red", B, "red", final);
  }

  /* ---------- 3D: Lunox on the right side next to the title ---------- */
  // Tweak these if a model faces the wrong way or looks too big/small:
  //   slot: -1 left, 1 right (she's on the right) | face: base rotation (radians) | height: fraction of the header height
  const ACTORS = [
    { name: "lunox", url: "assets/lunox_-_butterfly_seraphim.glb", slot: 1, face: -0.45, height: 0.9 },
  ];

  const wrap = $("catWrap");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.innerWidth < 640 ? 1.5 : 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  const FOV = 35, CAM_Z = 10;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
  camera.position.set(0, 0, CAM_Z);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 6); scene.add(key);
  const blueLight = new THREE.DirectionalLight(0x3b82f6, 2.2); blueLight.position.set(-6, 2, 3); scene.add(blueLight);
  const redLight = new THREE.DirectionalLight(0xef4444, 2.2); redLight.position.set(6, 2, 3); scene.add(redLight);

  ACTORS.forEach(a => {
    a.holder = new THREE.Group();  // position in the arena
    a.pivot = new THREE.Group();   // rotation + scale
    a.holder.add(a.pivot);
    scene.add(a.holder);
    a.size = null; a.mixer = null; a.baseY = 0;
  });

  function layout() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const visH = 2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * CAM_Z;
    const visW = visH * camera.aspect;
    ACTORS.forEach(a => {
      if (!a.size || !a.size.y) return;
      const diag = Math.hypot(a.size.x, a.size.z) || 1;
      a.pivot.scale.setScalar(Math.min((visH * a.height) / a.size.y, (visW * 0.2) / diag));
      a.baseY = -visH * 0.03;
      a.holder.position.set(a.slot * visW * 0.40, a.baseY, 0);
    });
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 200));
  if ("ResizeObserver" in window) new ResizeObserver(layout).observe(wrap);

  // loading (works with normal, Draco and Meshopt compressed glb files)
  const draco = new DRACOLoader();
  draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/");
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);
  loader.setMeshoptDecoder(MeshoptDecoder);

  const progress = ACTORS.map(() => 0);
  let remaining = ACTORS.length;
  const showProgress = () => { $("loading").textContent = `Loading Lunox… ${Math.round(progress.reduce((x, y) => x + y, 0) / ACTORS.length * 100)}%`; };
  const doneOne = () => { if (--remaining === 0) $("loading").classList.add("hidden"); };

  ACTORS.forEach((a, i) => loader.load(
    a.url,
    (gltf) => {
      const model = gltf.scene;
      model.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
      a.pivot.rotation.set(0, 0, 0); a.pivot.scale.setScalar(1); a.holder.position.set(0, 0, 0);
      a.pivot.add(model);
      if (gltf.animations.length) {
        a.mixer = new THREE.AnimationMixer(model);
        const idle = gltf.animations.find(c => /idle|stand|wait/i.test(c.name)) || gltf.animations[0];
        a.hasIdle = true;
        a.mixer.clipAction(idle).play();
        a.mixer.update(0); // apply the first animation frame so the measured size matches what you see
      }
      model.updateMatrixWorld(true);
      // precise = measure the real skinned pose (rigged models are way off otherwise)
      const box = new THREE.Box3().setFromObject(model, true);
      a.size = box.getSize(new THREE.Vector3());
      model.position.sub(box.getCenter(new THREE.Vector3())); // center on its pivot
      progress[i] = 1; showProgress(); layout(); doneOne();
    },
    (e) => { if (e.total) { progress[i] = e.loaded / e.total; showProgress(); } },
    (err) => { console.error("Couldn't load " + a.url, err); doneOne(); }
  ));

  /* ---------- animation loop ---------- */
  let spinning = false, spinStart = 0, last = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    const t = now / 1000;

    for (const a of ACTORS) {
      a.pivot.rotation.y = a.face;
      if (a.mixer) {
        a.mixer.update(dt);                                  // her own idle animation, always the same speed
        a.holder.position.y = a.baseY;
      } else {
        a.holder.position.y = a.baseY + Math.sin(t * 1.5) * 0.05; // no animation in the file: tiny float so she isn't frozen
      }
    }
    renderer.render(scene, camera);
  }

  requestAnimationFrame(animate);

  /* ---------- main button ---------- */
  const btn = $("btn"), status = $("status"), shotBtn = $("shotBtn");

  function start() {
    btn.disabled = true;
    btn.textContent = "🌀 Deciding...";
    shotBtn.classList.add("hidden");
    $("stage").classList.remove("hidden");
    layout();
    // on phones, keep the arena in view
    if (window.innerWidth < 1024) $("arena").scrollIntoView({ behavior: "smooth", block: "start" });

    spinning = true;
    spinStart = performance.now();

    const base = window.innerWidth < 640 ? 100 : 60; // gentler re-render rate on phones
    const tick = () => {
      const t = performance.now() - spinStart;
      if (t >= DURATION) return finish();
      render(false);
      status.textContent = MESSAGES[Math.min(MESSAGES.length - 1, Math.floor(t / (DURATION / MESSAGES.length)))];
      // fast at first, slowing down for suspense
      setTimeout(tick, base + Math.pow(t / DURATION, 3) * 450);
    };
    tick();
  }

  function finish() {
    spinning = false;
    render(true);
    status.textContent = "Teams locked! GG 🔥";
    // on phones, jump to the teams
    if (window.innerWidth < 1024) setTimeout(() => $("blue").scrollIntoView({ behavior: "smooth", block: "start" }), 300);
    btn.disabled = false;
    btn.textContent = "🎲 Re-roll";
    shotBtn.classList.remove("hidden");
  }

  btn.addEventListener("click", start);

  /* ---------- screenshot: both teams in ONE image ---------- */
  let shotUrl = null, shotFile = null;

  function showShot(blob) {
    if (shotUrl) URL.revokeObjectURL(shotUrl);
    shotUrl = URL.createObjectURL(blob);
    shotFile = new File([blob], "mlbb-draft.png", { type: "image/png" });
    $("shotImg").src = shotUrl;
    $("shotModal").classList.remove("hidden");
    $("shotModal").classList.add("flex");
  }

  async function takeShot() {
    if (!current || !window.html2canvas) { alert("Screenshot tool didn't load. Check your connection and refresh."); return; }
    const label = shotBtn.textContent;
    shotBtn.disabled = true;
    shotBtn.textContent = "⏳ Working...";

    // hidden export layout: title + Blue and Red side by side, fixed width
    const root = document.createElement("div");
    root.id = "exportRoot";
    root.className = "f-body text-slate-100";
    root.style.cssText = "position:fixed;left:-10000px;top:0;width:1200px;padding:32px;background:#070b14;";
    root.innerHTML = `
      <p style="text-align:center;font-size:12px;letter-spacing:.35em;color:#fcd34d;text-transform:uppercase">Mobile Legends · 5v5 Custom Draft</p><h1 class="f-display" style="text-align:center;font-size:34px;font-weight:900;letter-spacing:.1em;color:#f5c451;margin-top:6px">DRAFT ARENA</h1>
      <div class="grid grid-cols-2 gap-6 mt-5">
        ${card("Team Blue", current[0], "blue", true, true)}
        ${card("Team Red", current[1], "red", true, true)}
      </div>`;
    document.body.appendChild(root);

    try {
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      await new Promise(r => setTimeout(r, 250)); // let Tailwind generate the styles
      await Promise.all([...root.querySelectorAll("img")].map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
      const canvas = await html2canvas(root, {
        backgroundColor: "#070b14",
        scale: 2,
        useCORS: true,
        onclone: (doc) => { doc.getElementById("exportRoot").style.left = "0"; },
      });
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      showShot(blob);
    } catch (e) {
      console.error(e);
      alert("Couldn't make the screenshot. Open the console (F12) and send me the error.");
    } finally {
      root.remove();
      shotBtn.disabled = false;
      shotBtn.textContent = label;
    }
  }

  shotBtn.addEventListener("click", takeShot);
  $("shotClose").addEventListener("click", () => {
    $("shotModal").classList.add("hidden");
    $("shotModal").classList.remove("flex");
  });
  $("shotShare").addEventListener("click", async () => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [shotFile] })) {
        await navigator.share({ files: [shotFile], title: "MLBB Draft" });
      } else {
        const a = document.createElement("a");
        a.href = shotUrl; a.download = "mlbb-draft.png";
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) { /* share cancelled */ }
  });
</script>
</body>
</html>
