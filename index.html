<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLBB 5v5 Team Randomizer</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  body { background: #0f172a; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .45s ease-out both; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .shake { animation: shake .12s infinite; }
</style>
</head>
<body class="min-h-screen text-slate-100 font-sans">
<main class="max-w-5xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold text-center">MLBB 5v5 Team Randomizer</h1>
  <p class="text-center text-slate-400 mt-2 text-sm">Random team, random lane, random hero. Out of your comfort zone mode 😈</p>

  <div class="flex justify-center mt-8">
    <button id="btn" class="px-8 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 transition text-slate-900 font-bold text-lg shadow-lg disabled:opacity-60 disabled:cursor-not-allowed">
      🎲 Randomize Teams
    </button>
  </div>

  <p id="status" class="text-center text-amber-300 font-semibold mt-6 h-6"></p>

  <div id="stage" class="hidden grid lg:grid-cols-[1fr_auto_1fr] gap-6 mt-4 items-center">
    <div id="blue"></div>
    <div id="catWrap" class="order-first lg:order-none w-60 h-60 sm:w-72 sm:h-72 mx-auto flex items-center justify-center text-7xl"></div>
    <div id="red"></div>
  </div>
</main>

<audio id="music" src="assets/music.mp3" preload="auto"></audio>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  /* ---------- config ---------- */
  const DURATION = 7000; // ms
  const LANES = ["Gold Lane", "Mid Lane", "Jungle", "EXP Lane", "Roam"];
  const ICONS = { "Gold Lane": "🪙", "Mid Lane": "🔮", "Jungle": "🌲", "EXP Lane": "⚔️", "Roam": "🛡️" };
  const MESSAGES = [
    "Consulting the ancient spirits... 🔮",
    "Asking the cat... 🐱",
    "Bribing the RNG gods... 💸",
    "Calculating who feeds... 💀",
    "Checking who's gonna AFK... 😴",
    "Almost there... 👀",
  ];

  /* ---------- team logic ---------- */
  const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const PLAYERS = ["Dilla", "Soup", "Edouard", "Misha", "Lex", "Lifehack", "Maison", "Person1", "Blaze", "Kranok"];

  const HEROES = `Aamon|Akai|Aldous|Alice|Alpha|Alucard|Angela|Argus|Arlott|Atlas|Aulus|Aurora|Badang|Balmond|Bane|Barats|Baxia|Beatrix|Belerick|Benedetta|Brody|Bruno|Carmilla|Cecilion|Chang'e|Chip|Chou|Cici|Claude|Clint|Cyclops|Diggie|Dyrroth|Edith|Esmeralda|Estes|Eudora|Fanny|Faramis|Floryn|Franco|Fredrinn|Freya|Gatotkaca|Gloo|Gord|Granger|Grock|Guinevere|Gusion|Hanabi|Hanzo|Harith|Harley|Hayabusa|Helcurt|Hilda|Hirara|Hylos|Irithel|Ixia|Jawhead|Johnson|Joy|Julian|Kadita|Kagura|Kaja|Kalea|Karina|Karrie|Khaleed|Khufra|Kimmy|Lancelot|Lapu-Lapu|Layla|Leomord|Lesley|Ling|Lolita|Lukas|Lunox|Luo Yi|Lylia|Marcel|Martis|Masha|Mathilda|Melissa|Minotaur|Minsitthar|Miya|Moskov|Nana|Natalia|Natan|Nolan|Novaria|Obsidia|Odette|Paquito|Pharsa|Phoveus|Popol and Kupa|Rafaela|Roger|Ruby|Saber|Selena|Silvanna|Sora|Sun|Suyou|Terizla|Thamuz|Tigreal|Uranus|Vale|Valentina|Valir|Vexana|Wanwan|X.Borg|Xavier|Yi Sun-shin|Yin|Yu Zhong|Yve|Zetian|Zhask|Zhuxin|Zilong`.split("|");

  function generate() {
    // everyone is shuffled: first 5 = Blue, last 5 = Red
    const p = shuffle(PLAYERS);
    // 10 different random heroes, no duplicates across both teams
    const h = shuffle(HEROES).slice(0, 10);
    const A = {}, B = {};
    // each team gets its own random lane order, so anyone can get any lane
    const lanesA = shuffle(LANES), lanesB = shuffle(LANES);
    LANES.forEach((lane, i) => {
      A[lanesA[i]] = { name: p[i], hero: h[i] };
      B[lanesB[i]] = { name: p[i + 5], hero: h[i + 5] };
    });
    return [A, B];
  }

  function card(title, team, color, final) {
    const rows = LANES.map(lane => `
      <li class="flex items-center justify-between bg-slate-900/60 rounded-lg px-4 py-3">
        <span class="text-slate-400 text-sm">${ICONS[lane]} ${lane}</span>
        <span class="text-right leading-tight ${final ? 'pop' : 'shake'}">
          <span class="block font-semibold ${final ? 'text-white' : 'text-amber-300'}">${team[lane].name}</span>
          <span class="block text-sm ${final ? 'text-sky-300' : 'text-amber-200/70'}">${team[lane].hero}</span>
        </span>
      </li>`).join("");
    return `
      <section class="rounded-2xl p-5 bg-slate-800 border-t-4 ${color} shadow-lg">
        <h2 class="text-xl font-bold mb-4">${title}</h2>
        <ul class="space-y-2">${rows}</ul>
      </section>`;
  }

  const $ = (id) => document.getElementById(id);
  function render(final) {
    const [A, B] = generate();
    $("blue").innerHTML = card("Team Blue", A, "border-blue-500", final);
    $("red").innerHTML = card("Team Red", B, "border-red-500", final);
  }

  /* ---------- 3D cat ---------- */
  const wrap = $("catWrap");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 0.4, 4);
  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(3, 5, 4);
  scene.add(sun);

  const pivot = new THREE.Group();
  scene.add(pivot);
  let mixer = null;

  new GLTFLoader().load(
    "assets/oiiaioooooiai_cat.glb",
    (gltf) => {
      const model = gltf.scene;
      // center + scale to fit
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      const s = 2.2 / Math.max(size.x, size.y, size.z);
      pivot.scale.setScalar(s);
      pivot.add(model);
      if (gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
      }
    },
    undefined,
    (err) => {
      console.error("Couldn't load the cat model:", err);
      wrap.textContent = "🐱";
      wrap.classList.add("animate-spin");
    }
  );

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  wrap.appendChild(renderer.domElement);

  /* ---------- spin loop ---------- */
  const music = $("music");
  let spinning = false, spinStart = 0, last = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (spinning) {
      const t = now - spinStart;
      pivot.rotation.y += dt * 14;                       // goofy fast spin
      pivot.position.y = Math.abs(Math.sin(t / 120)) * 0.15; // little bounce
      if (mixer) mixer.update(dt);
      if (t > DURATION - 600) music.volume = Math.max(0, (DURATION - t) / 600); // fade out
    }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  /* ---------- main button ---------- */
  const btn = $("btn"), status = $("status");

  function start() {
    btn.disabled = true;
    btn.textContent = "🌀 Deciding...";
    $("stage").classList.remove("hidden");
    resize();

    music.currentTime = 0;
    music.volume = 1;
    music.play().catch((e) => console.warn("Audio blocked:", e));

    spinning = true;
    spinStart = performance.now();

    const tick = () => {
      const t = performance.now() - spinStart;
      if (t >= DURATION) return finish();
      render(false);
      status.textContent = MESSAGES[Math.min(MESSAGES.length - 1, Math.floor(t / (DURATION / MESSAGES.length)))];
      // fast at first, slowing down for suspense
      setTimeout(tick, 60 + Math.pow(t / DURATION, 3) * 450);
    };
    tick();
  }

  function finish() {
    spinning = false;
    music.pause();
    pivot.rotation.y = 0;
    pivot.position.y = 0;
    render(true);
    status.textContent = "Teams locked! GG 🔥";
    btn.disabled = false;
    btn.textContent = "🎲 Randomize Again";
  }

  btn.addEventListener("click", start);
</script>
</body>
</html>
